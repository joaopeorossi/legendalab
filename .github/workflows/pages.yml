# A cada push na main, publica a pasta site/ (demo estática, sem servidor) no GitHub Pages.
name: Publicar demo no GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
